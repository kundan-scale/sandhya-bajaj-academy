<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You're In: Your eBook is Ready | Sandhya Bajaj Academy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213d'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23ff6858'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .ty { min-height: calc(100vh - var(--header-h)); display: grid; place-items: center; padding: 48px 0 64px; }
    .ty__card {
      max-width: 640px; margin: 0 auto; text-align: center;
      background: var(--surface-raised); border: 1px solid var(--border-soft); border-radius: 24px;
      padding: 48px 40px; box-shadow: 0 30px 60px -40px rgba(20, 33, 61, 0.45);
    }
    .ty__tick {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
      background: var(--brand); color: var(--on-brand); display: grid; place-items: center;
    }
    .ty__tick svg { width: 30px; height: 30px; }
    .ty h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1.15; }
    .ty__lead { margin-top: 12px; color: var(--ink-body); }
    .ty .mockup { width: 210px; margin: 36px auto 44px; }
    .ty__note { margin-top: 14px; font-size: 14px; line-height: 22px; color: var(--ink-muted); }
    .ty .btn--accent { width: 100%; max-width: 340px; }
    @media (max-width: 767px) { .ty__card { padding: 36px 20px; border-radius: 20px; } .ty .mockup { width: 180px; } }
  </style>
  <!-- Paste the Meta Pixel / GTM snippet here; fire the Purchase event on this page. -->
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="site-header">
    <div class="container site-header__inner">
      <span class="wordmark">
        <span class="wordmark__name">SANDHYA BAJAJ</span>
        <span class="wordmark__tag">Academy of Personal Excellence</span>
      </span>
    </div>
  </header>

  <main class="ty">
    <div class="container">
      <div class="ty__card">
        <div class="ty__tick" aria-hidden="true"><svg><use href="#i-check"/></svg></div>
        <h1>You’re In. Your eBook is Ready</h1>
        <p class="ty__lead">Thank you for purchasing the Parenting Guide to Academic Excellence</p>

        <figure class="mockup mockup--ty">
  <div class="mockup__frame">
    <picture>
      <source srcset="assets/img/ebook-mockup-480.webp 480w, assets/img/ebook-mockup-800.webp 800w" sizes="(max-width: 767px) 200px, 260px" type="image/webp">
      <img src="assets/img/ebook-mockup-800.jpg" width="800" height="1132" loading="lazy" decoding="async" alt="Hardcover mockup of the Parenting Guide to Academic Excellence ebook by Sandhya Bajaj">
    </picture>
  </div>
</figure>

        <a class="btn btn--accent" id="download-btn" href="#" download>
          Download your eBook
          <span class="btn__arrow" aria-hidden="true"><svg><use href="#i-download"/></svg></span>
        </a>
        <p class="ty__note">PDF Format. Save a copy to your device for future access.</p>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    (function () {
      var url = ((window.FUNNEL_CONFIG || {}).DOWNLOAD_URL || "").trim();
      var btn = document.getElementById("download-btn");
      if (url) { btn.href = url; }
      else {
        btn.removeAttribute("download");
        btn.addEventListener("click", function (e) { e.preventDefault(); });
        console.info("[funnel] DOWNLOAD_URL is empty in js/config.js.");
      }
    })();
  </script>
</body>
</html>
